name: Fetch champions

# Determines each season's champion and commits the result, plus the
# rendered homepage, back to the repo. Run this once per year you want
# checked — a finished season's champion doesn't change.

on:
  workflow_dispatch:
    inputs:
      league_id:
        description: "Your ESPN league ID"
        required: true
        type: string
      years:
        description: "Space-separated completed seasons to check"
        required: false
        default: "2023 2024 2025"
        type: string
      current_year:
        description: "Season to pull the current team list from"
        required: false
        default: "2026"
        type: string

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install espn-api jinja2

      - name: Fetch champions
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
        run: |
          python fetch_champions.py "${{ inputs.league_id }}" \
            --years ${{ inputs.years }} \
            --current-year "${{ inputs.current_year }}"

      - name: Render the homepage
        run: |
          python -c "
          import json, render
          config = json.load(open('config.json'))
          render.build_home_page(config)
          "

      - name: Commit the results
        run: |
          git config user.name "league-bot"
          git config user.email "league-bot@users.noreply.github.com"
          git add champions.json docs/index.html docs/style.css
          if git diff --staged --quiet; then
            echo "Nothing new."
          else
            git commit -m "Update champions and homepage"
            git push
          fi
