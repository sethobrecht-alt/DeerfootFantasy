name: Weekly update

on:
  schedule:
    # 10:00 UTC Tuesday = 6am ET in season, after Monday Night Football wraps.
    - cron: "0 10 * * 2"
  workflow_dispatch:
    inputs:
      week:
        description: "Refetch a single week and rewrite its recaps"
        required: false
        type: string

concurrency:
  group: league-site
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build the site
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "${{ inputs.week }}" ]; then
            python build.py --week "${{ inputs.week }}"
          else
            python build.py
          fi

      - name: Commit the results
        run: |
          git config user.name "league-bot"
          git config user.email "league-bot@users.noreply.github.com"
          git add data docs standings_history.json
          if git diff --staged --quiet; then
            echo "Nothing new this week."
          else
            git commit -m "Update site: $(date -u +%Y-%m-%d)"
            git push
          fi
