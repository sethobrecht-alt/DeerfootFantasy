name: Weekly update

on:
  schedule:
    # ~6am ET Tuesday, after Monday Night Football wraps. GitHub gives the
    # `schedule` trigger no SLA -- it can fire hours late under platform
    # load, with no fix available from this repo's side (confirmed this
    # isn't an Actions-minutes/quota issue: the repo is public, so minutes
    # are unlimited, and the workflow's own `state` is "active"). Moving
    # off :00 (the worst minute, since that's when most repos' crons also
    # fire) helped but didn't fully fix it -- so this also carries three
    # staggered backup attempts across the morning. build.py only ever
    # commits when there's new data, so an attempt that finds nothing new
    # is a harmless no-op; this just raises the odds that AN attempt lands
    # close to on time instead of relying on exactly one shot.
    - cron: "7 10 * * 2"
    - cron: "23 11 * * 2"
    - cron: "41 12 * * 2"
    - cron: "19 14 * * 2"
  workflow_dispatch:
    inputs:
      week:
        description: "Refetch a single week and rewrite its recaps"
        required: false
        type: string

concurrency:
  group: league-site
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build the site
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "${{ inputs.week }}" ]; then
            python build.py --week "${{ inputs.week }}"
          else
            python build.py
          fi

      - name: Commit the results
        run: |
          git config user.name "league-bot"
          git config user.email "league-bot@users.noreply.github.com"
          git add data docs standings_history.json
          if git diff --staged --quiet; then
            echo "Nothing new this week."
          else
            git commit -m "Update site: $(date -u +%Y-%m-%d)"
            git push
          fi
