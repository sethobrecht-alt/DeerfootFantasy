name: Fetch draft history

# Fetches past-season draft results and commits them, plus the rendered
# page, back to the repo. Run this once per year you want added — a past
# draft doesn't change, so there's no need for a schedule.

on:
  workflow_dispatch:
    inputs:
      league_id:
        description: "Your ESPN league ID"
        required: true
        type: string
      years:
        description: "Space-separated years to fetch"
        required: false
        default: "2023 2024 2025"
        type: string

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install espn-api jinja2

      - name: Fetch draft history
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
        run: |
          python fetch_draft_history.py "${{ inputs.league_id }}" --years ${{ inputs.years }}

      - name: Render the page
        run: |
          python -c "
          import json, render
          config = json.load(open('config.json'))
          render.build_draft_history_page(config)
          "

      - name: Commit the results
        run: |
          git config user.name "league-bot"
          git config user.email "league-bot@users.noreply.github.com"
          git add draft_history.json docs/draft-history.html docs/style.css
          if git diff --staged --quiet; then
            echo "Nothing new."
          else
            git commit -m "Update draft history"
            git push
          fi
