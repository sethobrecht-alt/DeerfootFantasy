name: Fetch recap preview data

# One-off: pulls past-season data for previewing site features against real
# games before they go live -- either full box-score detail for a few weeks
# (recap voice), or each team's record/points/streak through a given week
# (power rankings). Prints to the log; nothing is committed to the repo.

on:
  workflow_dispatch:
    inputs:
      league_id:
        description: "Your ESPN league ID"
        required: true
        type: string
      year:
        description: "Season to pull from"
        required: true
        type: string
      weeks:
        description: "Space-separated week numbers (box-score mode)"
        required: false
        type: string
      through_week:
        description: "Standings through this week (record/points/streak mode)"
        required: false
        type: string

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install espn-api

      - name: Fetch
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
        run: |
          python preview_recap_data.py "${{ inputs.league_id }}" \
            --year "${{ inputs.year }}" \
            ${{ inputs.weeks && format('--weeks {0}', inputs.weeks) || '' }} \
            ${{ inputs.through_week && format('--through-week {0}', inputs.through_week) || '' }}
