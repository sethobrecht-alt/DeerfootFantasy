name: Temp waiver diagnostic

on:
  workflow_dispatch:
    inputs:
      league_id:
        required: true
        type: string
      year:
        required: true
        type: string

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install espn-api
      - name: Diagnose
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
        run: |
          python - "${{ inputs.league_id }}" "${{ inputs.year }}" <<'PYEOF'
          import json, os, sys
          from espn_api.football import League

          league_id, year = int(sys.argv[1]), int(sys.argv[2])
          espn_s2, swid = os.environ.get("ESPN_S2"), os.environ.get("SWID")
          league = League(league_id=league_id, year=year, espn_s2=espn_s2, swid=swid)

          print("faab enabled:", league.settings.faab)
          print("acquisition_budget:", league.settings.acquisition_budget)
          print("current_week:", league.current_week)

          for period in range(1, 5):
              print(f"\n===== scoring_period {period} =====")
              try:
                  txns = league.transactions(scoring_period=period, types={"FREEAGENT", "WAIVER", "WAIVER_ERROR"})
              except Exception as e:
                  print("  error:", e)
                  continue
              print(f"  {len(txns)} transactions")
              for t in txns[:40]:
                  items = ", ".join(f"{i.type}:{i.player}" for i in t.items)
                  print(f"  team={t.team.team_name!r} type={t.type} status={t.status} bid={t.bid_amount} date={t.date} items=[{items}]")
          PYEOF
